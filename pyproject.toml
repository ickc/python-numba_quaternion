[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "numba-quaternion"
version = "0.2.0"
description = "Quaternion operations that can be used within Numba-jit functions."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
keywords = ["quaternion", "numba", "rotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "numba>=0.59",
    "numpy>=1.23",
    # numba needs scipy for linear algebra (e.g. matmul) in jitted code
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ickc/python-numba_quaternion"
Documentation = "https://ickc.github.io/python-numba_quaternion"
Repository = "https://github.com/ickc/python-numba_quaternion"
Changelog = "https://github.com/ickc/python-numba_quaternion/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
]
lint = [
    "ruff>=0.6",
]
# sphinx>=8.2 requires Python>=3.11
docs = [
    "sphinx>=8.2; python_version >= '3.11'",
    "furo>=2024.8.6; python_version >= '3.11'",
    "myst-parser>=4; python_version >= '3.11'",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]

[tool.coverage.run]
branch = true
source = ["numba_quaternion"]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP"]
# returning Self would need typing_extensions on Python 3.10
ignore = ["PYI034"]
